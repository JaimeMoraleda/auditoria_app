<!DOCTYPE html>
<html>
<head>
    <title>Mapa GIS</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>

<body>

<h1>Mapa GIS — Alumnos y Asignaturas</h1>

<div id="map"></div>

<script>

var map = L.map('map').setView([40.4168, -3.7038], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap'
}).addTo(map);

var alumnos = {{ alumnos | tojson }};

alumnos.forEach(function(alumno) {

    L.marker([alumno.lat, alumno.lon])
    .addTo(map)
    .bindPopup(
        "<b>Alumno:</b> " + alumno.nombre
    );
});

var asignaturas = {{ asignaturas | tojson }};

asignaturas.forEach(function(asignatura) {

    var geojson = JSON.parse(asignatura.geojson);

    L.geoJSON(geojson, {
        onEachFeature: function(feature, layer) {
            layer.bindPopup(
                "<b>Asignatura:</b> " + asignatura.nombre
            );
        }
    }).addTo(map);
});

</script>

</body>
</html>
